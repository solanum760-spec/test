<title>Signal Jack</title>

<style>
/* Layout: one full-screen canvas — two playfields facing a central "broadcast tower" column with a striped sun. Single deliberate dark CRT look. */
:root {
  --night: #0b0820;
  --ink: #efe8ff;
  --dim: #8c7fb8;
  --p1: #38f2ff;
  --p2: #ff3fa8;
  --sun: #ffc35a;
  --panel: rgba(14, 9, 38, 0.94);
  --f-jp: "DotGothic16", "Hiragino Kaku Gothic ProN", "Meiryo", monospace;
  --f-num: "Share Tech Mono", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--ink); overflow: hidden; font-family: var(--f-jp); }
#cv { display: block; width: 100%; height: 100%; touch-action: none; }
.crt {
  position: fixed; inset: 0; pointer-events: none;
  background:
    repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.22) 2px 3px),
    radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
}
#panel {
  position: fixed; top: max(12px, env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  width: min(360px, calc(100vw - 32px)); max-height: calc(100% - 24px); overflow: auto;
  background: var(--panel); border: 1px solid var(--p1); padding: 12px 14px 14px;
  font-family: var(--f-jp); font-size: 13px; box-shadow: 0 0 24px rgba(56, 242, 255, 0.25);
}
#panel h2 { margin: 0 0 4px; font-size: 15px; font-weight: normal; color: var(--p1); }
#panel p { margin: 0 0 10px; color: var(--dim); font-size: 12px; line-height: 1.5; }
#panel .rows { display: grid; grid-template-columns: 1fr 88px; gap: 6px 10px; align-items: center; }
#panel label { min-width: 0; line-height: 1.3; }
#panel input {
  width: 100%; box-sizing: border-box; background: #05030f; color: var(--ink); border: 1px solid var(--dim);
  font-family: var(--f-num); font-size: 14px; padding: 3px 6px; font-variant-numeric: tabular-nums;
}
#panel input:focus-visible, #panel button:focus-visible { outline: 2px solid var(--sun); outline-offset: 1px; }
#panel .bar { display: flex; gap: 8px; margin-top: 12px; }
#panel button {
  flex: 1; background: transparent; color: var(--ink); border: 1px solid var(--p2); padding: 6px 8px;
  font-family: var(--f-jp); font-size: 13px; cursor: pointer;
}
#panel button:hover { background: rgba(255, 63, 168, 0.15); }
</style>

const INTRO_BARS = 2, OUTRO_BARS = 2;
const mainBars = song => song.form.length * 8;
const totalBars = song => INTRO_BARS + mainBars(song) + OUTRO_BARS;
function sectionOf(song, bar) {
  if (bar < INTRO_BARS) return 'intro';
  if (bar >= INTRO_BARS + mainBars(song)) return 'outro';
  return song.form[Math.floor((bar - INTRO_BARS) / 8)];
}
function melodyBar(song, bar) {
  const s = sectionOf(song, bar);
  if (s !== 'A' && s !== 'B') return null;
  return song[s][(bar - INTRO_BARS) % 4];
}
// 16分の n 番目の時刻（裏の16分だけスウィングで遅らせる）
const stepTime = (n, st, swing) => n * st + (n % 2 ? swing * st : 0);
// 譜面の密度から出す目安レベル（1〜15）
function songLevels(song) {
  const beat = 60 / song.bpm, dur = mainBars(song) * 4 * beat;
  return [0, 1, 2].map(d => Math.max(1, Math.min(15, Math.round(buildChart(song, d, beat).length / dur * 2.6))));
}

// ---- 状態 ----
let state = 'title'; // title | keycfg | select | play | pause | result
let M = null;        // 試合
let PV = null;       // 選曲画面の試聴
let selIdx = Math.max(0, Math.min(SONGS.length - 1, LS.get('sj.song', 0) | 0));
let selRows = [];    // 選曲画面の行の当たり判定
const hintSeen = {};
let hint = null;     // {text, t0(wall)}

// ================================================================ AUDIO
let ac = null, master, musicBus, sfxBus, delayIn, noiseBuf, schedTimer = null;
function ensureAudio() {
  if (ac) { if (ac.state === 'suspended' && state !== 'pause') ac.resume(); return; }
  ac = new (window.AudioContext || window.webkitAudioContext)();
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 4;
  master = ac.createGain(); master.gain.value = 0.8;
  master.connect(comp); comp.connect(ac.destination);
  musicBus = ac.createGain(); musicBus.gain.value = 0.55; musicBus.connect(master);
  sfxBus = ac.createGain(); sfxBus.gain.value = 0.75; sfxBus.connect(master);
  delayIn = ac.createDelay(1); delayIn.delayTime.value = 0.75 * 60 / 128;
  const fb = ac.createGain(); fb.gain.value = 0.32;
  const wet = ac.createGain(); wet.gain.value = 0.3;
  const dl = ac.createBiquadFilter(); dl.type = 'lowpass'; dl.frequency.value = 2400;
  delayIn.connect(dl); dl.connect(fb); fb.connect(delayIn); dl.connect(wet); wet.connect(musicBus);
  noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  schedTimer = setInterval(tick, 25);
}
function unmute() {
  const t = ac.currentTime;
  master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(0.8, t);
}
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function env(gn, t, a, peak, dur) {
  gn.gain.setValueAtTime(0.0001, t);
  gn.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + a + dur);
}
function outChain(node, pan, dest) {
  if (pan != null && ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = pan; node.connect(p); p.connect(dest); }
  else node.connect(dest);
}
function tone(type, f, t, dur, peak, dest, o = {}) {
  const os = ac.createOscillator(); os.type = type; os.frequency.setValueAtTime(f, t);
  if (o.fEnd) os.frequency.exponentialRampToValueAtTime(o.fEnd, t + (o.fTime || dur));
  if (o.detune) os.detune.value = o.detune;
  const gn = ac.createGain(); const a = o.a || 0.004; env(gn, t, a, peak, dur);
  let n = os;
  if (o.lp) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.lp; fl.Q.value = o.q || 0.7; n.connect(fl); n = fl; }
  n.connect(gn); outChain(gn, o.pan, dest);
  if (o.send) gn.connect(o.send);
  os.start(t); os.stop(t + a + dur + 0.05);
  return os;
}
function noise(t, dur, peak, dest, o = {}) {
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const gn = ac.createGain(); env(gn, t, 0.002, peak, dur);
  let n = s;
  for (const [type, f] of [['highpass', o.hp], ['bandpass', o.bp], ['lowpass', o.lp]]) {
    if (!f) continue; const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; n.connect(b); n = b;
  }
  n.connect(gn); outChain(gn, o.pan, dest);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
}
// --- 楽器 ---
const kick = t => tone('sine', 150, t, 0.2, 0.9, musicBus, { fEnd: 42, fTime: 0.12 });

const bass = (m, t, d) => tone('sawtooth', mtof(m), t, d, 0.26, musicBus, { lp: 720, q: 5 });
const pad = (tones, t, d) => tones.forEach(m => tone('triangle', mtof(m), t, d, 0.045, musicBus, { a: 0.25 }));
const stab = (tones, t, d) => tones.forEach(m => tone('sawtooth', mtof(m), t, d, 0.035, musicBus, { lp: 1800, q: 2 }));
const ghostSnare = t => noise(t, 0.05, 0.1, musicBus, { bp: 2200 });
function lead(owner, midi, t, dur) {
  const f = mtof(midi);
  if (owner === 1) { // P1：明るいノコギリ波2本
    tone('sawtooth', f, t, dur, 0.13, musicBus, { a: 0.006, lp: 3400, q: 3, detune: -8, pan: -0.3, send: delayIn });

  drawCountIn(now);
  drawHint();
  if (state === 'pause') {
    g.fillStyle = 'rgba(5,3,15,0.75)'; g.fillRect(0, 0, W, H);
    txt('一時停止', L.cx, H * 0.42, 34, C.ink, { glow: 12, glowColor: C.p1 });
    txt('Esc / Enter：再開　　Q：選曲へ', L.cx, H * 0.42 + 46, 15, C.dim);
  }
  if (state === 'result') drawResult(wall);
}
function drawResult(wall) {
  const r = M.result, age = wall - r.at, { W, H, cx } = L;
  g.fillStyle = `rgba(5,3,15,${Math.min(0.78, age * 2)})`; g.fillRect(0, 0, W, H);
  const pop = Math.min(1, age * 5);
  const head = r.winner === 0 ? 'DRAW' : `P${r.winner} WIN`;
  const hc = r.winner === 0 ? C.ink : pc(r.winner);
  txt(r.reason === 'ko' ? 'SIGNAL JACKED!' : '放送終了', cx, H * 0.17, 16, C.sunA, { font: r.reason === 'ko' ? F.num : F.jp, alpha: pop });
  txt(head, cx, H * 0.17 + 44, Math.min(64, W * 0.1) * (0.6 + 0.4 * pop), hc, { font: F.logo, glow: 24, alpha: pop });
  // confetti for winner side
  if (r.winner) {
    const fd = L.f[r.winner - 1];
    for (let i = 0; i < 24; i++) {
      const x = fd.x + ((i * 97 + 13) % 100) / 100 * fd.w, y = ((age * (60 + (i % 5) * 25) + i * 37) % (H * 0.9));
      g.fillStyle = [C.p1, C.p2, C.sunA, '#fff'][i % 4]; g.fillRect(x + Math.sin(age * 3 + i) * 8, y, 5, 3);
    }
  }
  for (const pl of M.pl) {
    const fd = L.f[pl.id - 1], x = fd.x + fd.w / 2, y = H * 0.36, s = pl.stats, col = pc(pl.id);
    txt(`P${pl.id}${pl.cpu ? ' CPU' : ''}`, x, y, 20, col, { font: F.num, glow: 8 });
    txt(praise(pl), x, y + 30, Math.min(20, fd.w * 0.08), C.sunA, { glow: 8 });
    const lines = [['PERFECT', s.P], ['GREAT', s.G], ['GOOD', s.D], ['MISS', s.M], ['最大コンボ', pl.maxCombo], ['送信', s.sends], ['反射', s.reflects]];
    lines.forEach(([k, v], i) => {
      const yy = y + 64 + i * 22;
      txt(k, x - fd.w * 0.32, yy, 13, C.dim, { align: 'left' });
      txt(String(v), x + fd.w * 0.32, yy, 15, C.ink, { font: F.num, align: 'right' });
    });
  }
  if (age > 0.6) txt('Enter / タップ：同じ曲でもう一度　　Esc：選曲へ', cx, H * 0.86, 15, C.ink, { alpha: 0.6 + 0.4 * Math.sin(wall * 4) });
}
const LEVELS = SONGS.map(songLevels);
function drawSelect(wall) {
  const { W, H, cx } = L, song = SONGS[selIdx], pal = song.pal;
  const beat = 60 / song.bpm;
  drawBackdrop(PV && ac ? ac.currentTime - PV.startAt + 10 : wall, song, beat);
  g.fillStyle = 'rgba(5,3,15,0.4)'; g.fillRect(0, 0, W, H);
  const bw = Math.min(640, W - 32), bx = cx - bw / 2;
  txt('選曲', cx, Math.max(36, H * 0.07), 26, C.ink, { glow: 12, glowColor: pal.sunB });
  const rh = Math.max(50, Math.min(64, H * 0.085)), top = Math.max(64, H * 0.13);
  const fsT = Math.max(15, Math.min(22, bw / 26)), fsS = Math.max(11, Math.min(13, bw / 48));
  // 拍に合わせて選択中の行を脈打たせる
  const pulse = PV && ac ? 1 - (((ac.currentTime - PV.startAt) / beat) % 1 + 1) % 1 : 0;
  selRows = [];
  SONGS.forEach((s, i) => {
    const y = top + i * (rh + 8), cur = i === selIdx;
    selRows.push({ i, x: bx, y, w: bw, h: rh });
    g.fillStyle = cur ? 'rgba(8,5,25,0.92)' : 'rgba(8,5,25,0.7)'; g.fillRect(bx, y, bw, rh);
    g.save();
    if (cur) { g.shadowColor = s.pal.sunB; g.shadowBlur = 10 + 10 * pulse; }
    g.strokeStyle = cur ? s.pal.sunA : 'rgba(140,127,184,0.35)'; g.lineWidth = cur ? 2 : 1;
    g.strokeRect(bx + 0.5, y + 0.5, bw - 1, rh - 1); g.restore();
    // 太陽の色見本
    const sg = g.createLinearGradient(0, y + 10, 0, y + rh - 10);
    sg.addColorStop(0, s.pal.sunA); sg.addColorStop(1, s.pal.sunB);
    g.fillStyle = sg; g.beginPath(); g.arc(bx + 26, y + rh / 2, Math.min(14, rh * 0.26), 0, Math.PI * 2); g.fill();
    txt(s.title, bx + 52, y + rh * 0.36, fsT, cur ? C.ink : C.dim, { font: F.num, align: 'left', glow: cur ? 8 : 0, glowColor: s.pal.sunB });
    g.save(); g.beginPath(); g.rect(bx + 52, y, Math.max(0, bw - 52 - 118), rh); g.clip();
    txt(s.mood, bx + 52, y + rh * 0.72, fsS, cur ? C.ink : C.dim, { align: 'left', alpha: cur ? 0.85 : 0.6 });
    g.restore();
    txt(`${s.bpm} BPM`, bx + bw - 14, y + rh * 0.36, fsS + 1, cur ? s.pal.sunA : C.dim, { font: F.num, align: 'right' });
    const lv = LEVELS[i];
    txt(`E${lv[0]}  N${lv[1]}  H${lv[2]}`, bx + bw - 14, y + rh * 0.72, fsS, C.dim, { font: F.num, align: 'right' });
  });
  // 詳細
  const dy = top + SONGS.length * (rh + 8) + 6, dh = rh * 1.5;
  g.fillStyle = 'rgba(8,5,25,0.88)'; g.fillRect(bx, dy, bw, dh);
  g.strokeStyle = pal.sunB; g.strokeRect(bx + 0.5, dy + 0.5, bw - 1, dh - 1);
  const secs = Math.round(totalBars(song) * 4 * beat);
  const n1 = buildChart(song, cfg.d1, beat).length;
  txt(`特徴：${song.feature}`, bx + 16, dy + dh * 0.3, fsS + 1, C.ink, { align: 'left' });
  txt(`長さ ${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}　　P1 ${DIFFS[cfg.d1]} のノーツ数 ${n1}　　試聴中`, bx + 16, dy + dh * 0.7, fsS, C.dim, { align: 'left' });
  // 操作
  const fy = dy + dh + 26;
  txt(`↑↓ 選ぶ　Enter 決定　Esc 戻る`, cx, fy, fsS + 1, C.sunA, { alpha: 0.7 + 0.3 * Math.sin(wall * 4) });
  txt(`Z：P1 ${DIFFS[cfg.d1]}　　/：${cfg.mode === 'cpu' ? 'CPU' : 'P2'} ${DIFFS[cfg.d2]}　　（E/N/H は難しさ別の目安レベル）`, cx, fy + 24, fsS, C.dim);
}
function drawTitle(wall) {
  const { W, H, cx } = L;
  drawBackdrop(wall, SONGS[selIdx], 60 / SONGS[selIdx].bpm);
  g.fillStyle = 'rgba(5,3,15,0.35)'; g.fillRect(0, 0, W, H);
  const ls = Math.min(78, W * 0.11);
  txt('SIGNAL JACK', cx, H * 0.2, ls, C.p1, { font: F.logo, glow: 28, glowColor: C.p2 });
  txt('電波ジャック ── レトロフューチャー対戦音ゲー（試作）', cx, H * 0.2 + ls * 0.75, Math.max(12, Math.min(17, W / 40)), C.ink);
  const bw = Math.min(560, W - 32), bx = cx - bw / 2, by = H * 0.38, lh = Math.max(24, Math.min(30, H * 0.042));
  g.fillStyle = 'rgba(8,5,25,0.88)'; g.fillRect(bx, by, bw, lh * 8.6);
  g.strokeStyle = C.p2; g.strokeRect(bx + 0.5, by + 0.5, bw - 1, lh * 8.6 - 1);
  const fs = Math.max(12, Math.min(15, bw / 34));
  if (state === 'keycfg') {
    txt('キー設定 ── 光っている項目のキーを押す（Esc でやめる）', cx, by + lh * 0.8, fs, C.sunA);
    const names = ['レーン1', 'レーン2', 'レーン3', 'レーン4', '送信'];
    KEYCFG_STEPS.forEach(([id, i], k) => {
      const col = k < 5 ? 0 : 1, row = k % 5, xx = bx + bw * (col ? 0.55 : 0.08), yy = by + lh * (2 + row * 1.2);
      const cur = k === keycfgIdx;
      txt(`P${id} ${names[i]}`, xx, yy, fs, cur ? C.sunA : C.dim, { align: 'left', glow: cur ? 8 : 0 });
      txt(keyName(keycfgDraft[id][i]), xx + bw * 0.3, yy, fs, cur ? C.sunA : pc(id), { font: F.num, align: 'left' });
    });
    return;
  }
  const rows2 = [
    ['モード', cfg.mode === 'cpu' ? 'CPUと対戦' : 'ふたりで対戦（同じキーボード）', 'M'],
    ['P1 の難しさ', DIFFS[cfg.d1], 'Z'],
    [cfg.mode === 'cpu' ? 'CPU の強さ' : 'P2 の難しさ', DIFFS[cfg.d2], '/'],
    ['音ズレ補正', `${cfg.offset > 0 ? '+' : ''}${cfg.offset} ms（FASTが多いなら＋）`, '← →'],
    ['キー設定', `P1 ${laneKeysText(1)} / ${keyName(KEYS[1][4])}　P2 ${laneKeysText(2)} / ${keyName(KEYS[2][4])}`, 'K'],
    ['パラメータ調整', '数値をその場で変える', 'F2'],
  ];
  rows2.forEach(([k, v, key], i) => {
    const yy = by + lh * (0.9 + i);
    txt(k, bx + 16, yy, fs, C.dim, { align: 'left' });
    txt(v, bx + bw * 0.3, yy, fs, C.ink, { align: 'left' });
    txt(key, bx + bw - 16, yy, fs, C.p1, { font: F.num, align: 'right' });
  });
  txt('Enter / クリックで選曲へ', cx, by + lh * 7.6, fs + 4, C.sunA, { glow: 12, alpha: 0.7 + 0.3 * Math.sin(wall * 4) });
  const rules = ['PERFECT で電圧がたまる → 送信キーで相手に干渉を送る（ためるほど強い・ミスで全部消える）',
    '相手の干渉ノーツを PERFECT で叩くと跳ね返る ── 優勢な側の楽器が曲の主旋律を取る'];
  rules.forEach((s, i) => txt(s, cx, by + lh * 8.6 + 22 + i * 20, Math.max(10, Math.min(13, W / 62)), C.dim));
  if (coarse) txt('タッチ：左のレーンを叩く・中央の列で送信', cx, by + lh * 8.6 + 64, 12, C.dim);
}

function frame() {
  const wall = performance.now() / 1000;
  if (!L) resize();
  g.clearRect(0, 0, L.W, L.H);
  if (M && (state === 'play' || state === 'pause' || state === 'result')) {
    const now = songNow();
    if (state === 'play') update(now);
    drawGame(now, wall);
  } else if (state === 'select') drawSelect(wall);
  else drawTitle(wall);
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
</script>
